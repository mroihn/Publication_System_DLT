version: '3.8'

networks:
  publishing-network:
    driver: bridge

volumes:
  pg_publish_data:

services:
  database:
    image: postgres:15-alpine
    container_name: publishing_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-publish_db}
    ports:
      - "5433:5432"
    networks:
      - publishing-network
    volumes:
      - pg_publish_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: publishing_backend
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - DB_HOST=database
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-publish_db}
      - JWT_SECRET=${JWT_SECRET:-supersecret}
    ports:
      - "3001:3001"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - publishing-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: publishing_frontend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - publishing-network
